cartesian_motion_controller:
    type: "position_controllers/CartesianMotionController"
    end_effector_link: gripper_link
    robot_base_link: base_link
    joints:
     - shoulder_pan_joint
     - shoulder_lift_joint
     - elbow_joint
     - wrist_1_joint
     - wrist_2_joint
     - wrist_3_joint

    solver:
        error_scale: 0.5
        iterations: 1

    pd_gains:
        trans_x: {p: 10.0}
        trans_y: {p: 10.0}
        trans_z: {p: 10.0}
        rot_x: {p: 1.0}
        rot_y: {p: 1.0}
        rot_z: {p: 1.0}

cartesian_force_controller:
    type: "position_controllers/CartesianForceController"
    robot_description_name: "/robot_description"
    end_effector_link: gripper_link
    robot_base_link: base_link
    ft_sensor_ref_link: wrist_ft_sensor
    joints:
     - shoulder_pan_joint
     - shoulder_lift_joint
     - elbow_joint
     - wrist_1_joint
     - wrist_2_joint
     - wrist_3_joint

    solver:
        error_scale: 0.1 # 0.7 is nice in contact
        iterations: 1

    pd_gains:
        trans_x: {p: 0.05}
        trans_y: {p: 0.05}
        trans_z: {p: 0.05}
        rot_x: {p: 1.50}
        rot_y: {p: 1.50}
        rot_z: {p: 1.50}

cartesian_compliance_controller:
    type: "position_controllers/CartesianComplianceController"
    end_effector_link: gripper_link
    robot_base_link: base_link
    ft_sensor_ref_link: wrist_ft_sensor
    compliance_ref_link: wrist_ft_sensor
    joints:
     - shoulder_pan_joint
     - shoulder_lift_joint
     - elbow_joint
     - wrist_1_joint
     - wrist_2_joint
     - wrist_3_joint

    stiffness:  # w.r.t. compliance_ref_link
        trans_x: 500
        trans_y: 500
        trans_z: 500
        rot_x: 20
        rot_y: 20
        rot_z: 20

    solver:
        error_scale: 1.5 # up to 2.0 was nice in free space
        iterations: 1

    pd_gains:
        trans_x: {p: 0.05}
        trans_y: {p: 0.05}
        trans_z: {p: 0.05}
        rot_x: {p: 1.5}
        rot_y: {p: 1.5}
        rot_z: {p: 1.5}

motion_control_handle:
   type: "cartesian_controllers/MotionControlHandle"
   end_effector_link: gripper_link
   robot_base_link: base_link
   joints:
     - shoulder_pan_joint
     - shoulder_lift_joint
     - elbow_joint
     - wrist_1_joint
     - wrist_2_joint
     - wrist_3_joint
